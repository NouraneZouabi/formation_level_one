apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: spring-app
  labels: 
    release: my-kube-prometheus-stack

spec:
  selector:
    matchLabels: 
      app: spring-boot-app
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
